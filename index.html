<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ede9f6">
  <meta name="description" content="DZIKI PONG — gra z komputerem lub dla dwóch osób. Przeszkody, podwójna piłka i mecz do 10 punktów!">
  <title>DZIKI PONG — do dziesięciu!</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23614bd4'/%3E%3Cpath stroke='%23d7ff3f' stroke-width='4' d='M7 9v14M25 9v14'/%3E%3Ccircle cx='16' cy='16' r='3' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <section class="game" aria-label="DZIKI PONG">
      <div class="scorebar"><div class="player"><div class="player-icon" aria-hidden="true">⌘</div><div class="player-copy"><div class="player-name" id="left-name">KOMPUTER</div><div class="player-detail" id="left-detail">Lewa strona · CPU</div></div></div><div class="score" aria-label="Wynik"><span id="cpu-score">0</span><span class="colon">:</span><span id="human-score">0</span></div><div class="player right"><div class="player-copy"><div class="player-name" id="right-name">TY</div><div class="player-detail" id="right-detail">Prawa strona · gracz</div></div><div class="player-icon" aria-hidden="true">↕</div></div></div>
      <div class="court" id="court"><canvas id="board" aria-label="Plansza: komputer po lewej, twoja platforma po prawej. Sterowanie strzałkami w górę i w dół, myszą lub dotykiem."></canvas><div class="court-label" id="left-court-label">CPU / 01</div><div class="court-label right-label" id="right-court-label">PLAYER / 02</div><div class="round-message" id="round-message"></div><div class="overlay" id="overlay"><div class="start-card"><p class="eyebrow" id="eyebrow">GOTOWY NA ODBICIE?</p><h2 id="overlay-title">Rozkręć ten mecz.</h2><p id="overlay-description">Sterujesz limonkową platformą po prawej.<br>Zdobądź 10 punktów i pokonaj komputer.</p><label class="mode-picker" for="game-mode"><span>Tryb gry</span><select id="game-mode" aria-describedby="mode-note"><option value="solo">Gracz kontra komputer</option><option value="duo">Dwóch graczy</option></select></label><span class="mode-note" id="mode-note">Zmiana trybu zeruje wynik.</span><button class="primary" id="play">Gramy! <span aria-hidden="true">↗</span></button></div></div></div>
      <div class="toolbar"><div class="live"><span class="live-dot"></span><span id="status">Czekamy na pierwszy serwis</span></div><div class="tools"><button class="tool" id="sound" aria-pressed="false" aria-label="Włącz dźwięk">♪ <span>Dźwięk: wył.</span></button><button class="tool" id="pause" disabled>Ⅱ Pauza</button><button class="tool" id="restart" aria-label="Rozpocznij nowy mecz">↻ <span>Od nowa</span></button></div></div>
    </section>
    <div class="sr-only" id="announcement" role="status" aria-live="polite"></div>
  </main>
  <script src="game.js"></script>
</body>
</html>
