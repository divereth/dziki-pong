<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ede9f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="DZIKI PONG — gra z komputerem lub dla dwóch osób. Przeszkody, podwójna piłka i mecz do 10 punktów!">
  <title>DZIKI PONG — do dziesięciu!</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23614bd4'/%3E%3Cpath stroke='%23d7ff3f' stroke-width='4' d='M7 9v14M25 9v14'/%3E%3Ccircle cx='16' cy='16' r='3' fill='white'/%3E%3C/svg%3E">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/dziki-pong-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <section class="game" aria-label="DZIKI PONG">
      <div class="scorebar">
        <div class="tools score-tools score-tools-left">
          <button class="tool" id="fullscreen" aria-pressed="false" aria-label="Włącz pełny ekran">⛶ <span>Pełny ekran</span></button>
          <button class="tool" id="sound" aria-pressed="true" aria-label="Wyłącz dźwięk">♪ <span>Dźwięk: wł.</span></button>
        </div>
        <div class="player"><div class="player-icon" aria-hidden="true">⌘</div><div class="player-copy"><div class="player-name" id="left-name">KOMPUTER</div><div class="player-detail" id="left-detail">Lewa strona · CPU</div></div></div>
        <div class="score" aria-label="Wynik"><span id="cpu-score">0</span><span class="colon">:</span><span id="human-score">0</span></div>
        <div class="player right"><div class="player-copy"><div class="player-name" id="right-name">TY</div><div class="player-detail" id="right-detail">Prawa strona · gracz</div></div><div class="player-icon" aria-hidden="true">↕</div></div>
        <div class="tools score-tools score-tools-right">
          <button class="tool" id="pause" aria-label="Wstrzymaj mecz" disabled>Ⅱ <span>Pauza</span></button>
          <button class="tool" id="restart" aria-label="Rozpocznij nowy mecz">↻ <span>Od nowa</span></button>
        </div>
      </div>
      <div class="sr-only" id="status" role="status" aria-live="polite">Czekamy na pierwszy serwis</div>
      <div class="court-frame" id="court-frame"><div class="court" id="court"><canvas id="board" aria-label="Plansza: komputer po lewej, twoja platforma po prawej. Sterowanie strzałkami w górę i w dół, myszą lub dotykiem."></canvas><div class="court-label" id="left-court-label">CPU / 01</div><div class="court-label right-label" id="right-court-label">PLAYER / 02</div><div class="round-message" id="round-message"></div><div class="overlay" id="overlay"><div class="start-card"><p class="eyebrow" id="eyebrow">GOTOWY NA ODBICIE?</p><h2 id="overlay-title">Rozkręć ten mecz.</h2><p id="overlay-description">Sterujesz limonkową platformą po prawej.<br>Zdobądź 10 punktów i pokonaj komputer.</p><div class="mode-picker" role="group" aria-label="Wybierz tryb gry"><button class="mode-option" id="mode-solo" type="button" aria-pressed="true"><span class="mode-option-icon" aria-hidden="true"><svg viewBox="0 0 48 48"><rect x="6" y="7" width="36" height="27" rx="4"></rect><path d="M17 41h14M24 34v7"></path><circle cx="17" cy="19" r="2"></circle><circle cx="31" cy="19" r="2"></circle><path d="M17 26h14"></path></svg></span><span class="mode-option-title">VS komputer</span><span class="mode-option-detail">Zagraj z AI</span></button><button class="mode-option" id="mode-duo" type="button" aria-pressed="false"><span class="mode-option-icon" aria-hidden="true"><svg viewBox="0 0 48 48"><circle cx="17" cy="15" r="6"></circle><circle cx="33" cy="17" r="5"></circle><path d="M5 39c0-8 4-13 12-13s12 5 12 13M27 29c2-2 4-3 7-3 6 0 10 5 10 13H29"></path></svg></span><span class="mode-option-title">2 graczy</span><span class="mode-option-detail">W/S · ↑/↓ lub dotyk</span></button></div><span class="mode-note" id="mode-note">Wybierz tryb, aby zacząć.</span><button class="install-app" id="install-app" type="button" hidden>⇩ Zainstaluj grę</button><p class="install-note" id="install-note" role="status" aria-live="polite" hidden></p><button class="primary" id="play" hidden>Gramy! <span aria-hidden="true">↗</span></button></div></div></div></div>
    </section>
    <div class="sr-only" id="announcement" role="status" aria-live="polite"></div>
  </main>
  <script src="game.js"></script>
  <script>
    (() => {
      const button = document.getElementById('install-app');
      const note = document.getElementById('install-note');
      let installPrompt = null;
      const isInstalled = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
      const refreshInstallButton = () => {
        const installed = isInstalled();
        button.hidden = installed;
        if (installed) note.hidden = true;
      };

      window.addEventListener('beforeinstallprompt', event => {
        event.preventDefault();
        installPrompt = event;
        refreshInstallButton();
      });
      window.addEventListener('appinstalled', () => {
        installPrompt = null;
        refreshInstallButton();
      });
      window.matchMedia('(display-mode: standalone)').addEventListener('change', refreshInstallButton);

      button.addEventListener('click', async () => {
        if (installPrompt) {
          const prompt = installPrompt;
          installPrompt = null;
          await prompt.prompt();
          const choice = await prompt.userChoice;
          if (choice.outcome === 'accepted') {
            button.hidden = true;
            note.hidden = true;
          } else {
            note.textContent = 'Instalację możesz uruchomić później z menu przeglądarki.';
            note.hidden = false;
          }
          return;
        }

        const isAppleMobile = /iPhone|iPad|iPod/.test(navigator.userAgent)
          || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        note.textContent = isAppleMobile
          ? 'W Safari wybierz Udostępnij, a następnie „Dodaj do ekranu początkowego”.'
          : 'Otwórz menu przeglądarki i wybierz „Zainstaluj aplikację” lub „Dodaj do ekranu głównego”.';
        note.hidden = false;
      });

      refreshInstallButton();
    })();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(error => {
          console.error('Nie udało się uruchomić trybu offline:', error);
        });
      });
    }
  </script>
</body>
</html>
