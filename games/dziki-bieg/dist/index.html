<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#254f37"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Uniboar"><meta name="description" content="Robot Uniboar Attack. Race through the forest, jump mossy platforms and smash giant pine cones. Z to jump, X to leaf dash."><title>Robot Uniboar Attack</title><link rel="icon" type="image/svg+xml" href="icon.svg"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="stylesheet" href="style.css"></head>
<body><main class="game-wrap">
<section id="game-frame" class="game-frame" aria-label="Robot Uniboar Attack">
  <canvas id="game" width="1280" height="720" tabindex="-1" aria-label="Robot Uniboar Attack game"></canvas>
  <div id="hud" class="hud" hidden><div id="lives" class="lives" aria-label="Three wishes remaining"></div><span id="score">0</span></div>
  <div id="dash-hint" class="dash-hint" role="status" hidden>Press <kbd>X</kbd> to dash</div>
  <div id="title-screen" class="title-screen"><img class="title-art" src="forest-panorama.webp" alt="A sunlit woodland with ancient oaks, ferns and pine cones"><h1 class="forest-logo"><span>ROBOT</span>UNIBOAR<span>ATTACK</span></h1><div class="title-hero" aria-hidden="true"></div><button id="play" class="magic play">CLICK to PLAY!</button><div id="instructions" class="instructions" hidden><p>Z - jump, double jump&nbsp;&nbsp; X - leaf dash</p><button id="begin" class="magic">Press Z to make your wishes come true!</button></div></div>
  <div id="intro" class="purple-screen intro" hidden><p class="magic">You get 3 wishes!</p><div class="wish-spirit" aria-hidden="true"></div><p class="magic">You will fail!</p></div>
  <div id="result" class="purple-screen result" aria-live="polite" hidden><h1 class="magic" id="result-title">Wish 1</h1><div id="wish-scores" class="wish-scores"></div><div class="result-head-wrap"><canvas id="result-head" width="480" height="320" role="img" aria-label="The Uniboar's wrecked robotic head, with cracked armor and torn wires"></canvas></div><p id="result-total" class="result-total" hidden></p><p id="result-message" class="magic">Don't give up on your dreams.</p><section id="leaderboard" class="leaderboard" aria-labelledby="leaderboard-title" hidden><h2 id="leaderboard-title">Global leaderboard <small data-total></small></h2><form hidden><label for="leaderboard-nickname">Save your score · your nickname</label><div><input id="leaderboard-nickname" name="nickname" maxlength="40" autocomplete="nickname" required placeholder="Enter your nickname"><button type="submit">Save score</button></div></form><form id="leaderboard-search" data-search-form hidden><label for="leaderboard-search-nickname">Find player</label><div><input id="leaderboard-search-nickname" type="search" maxlength="40" autocomplete="off" placeholder="Nickname or its beginning"><button type="submit">Search</button></div></form><p role="status"></p><button type="button" data-retry hidden>Retry loading</button><div class="leaderboard-table" tabindex="0" aria-label="Global ranking results"><table><thead><tr><th scope="col">#</th><th scope="col">Nickname</th><th scope="col">Score</th></tr></thead><tbody></tbody></table></div><nav aria-label="Browse leaderboard"><button type="button" data-page="top">Top</button><button type="button" data-page="previous" aria-label="Previous results">←</button><button type="button" data-page="next" aria-label="Next results">→</button><button type="button" data-page="mine">My score</button><button type="button" data-page="find" aria-controls="leaderboard-search" aria-expanded="false">Find</button></nav></section><button id="next" class="magic"></button></div>
  <div id="paused" class="purple-screen paused" hidden><h2 class="magic">Paused</h2><button id="resume" class="magic">Press P to keep dreaming</button></div>
  <div class="touch-controls" id="touch-controls" hidden><button id="jump" class="touch-half touch-jump" data-touch-action="jump" aria-label="Left half: jump; hold for height, tap again for double jump"><span class="touch-hint" aria-hidden="true"><span class="touch-symbol">↑</span>JUMP</span></button><button id="dash" class="touch-half touch-dash" data-touch-action="dash" aria-label="Right half: leaf dash"><span class="touch-hint" aria-hidden="true"><span class="touch-symbol">»</span>DASH</span></button></div>
  <button id="fullscreen" class="in-game-button fullscreen-button" type="button" aria-label="Enter full screen" title="Full screen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
  <button id="pause" class="in-game-button pause-button" type="button" aria-label="Pause game" title="Pause" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button>
  <div id="menu-actions" class="menu-actions"><button id="settings-open" type="button" aria-controls="settings" aria-expanded="false">Audio settings</button></div>
  <section id="settings" class="settings-screen" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden><div class="settings-card"><h2 id="settings-title">Settings</h2><label for="music-volume">Music <output id="music-value" for="music-volume">100%</output></label><input id="music-volume" type="range" min="0" max="100" value="100"><label for="effects-volume">Sound effects <output id="effects-value" for="effects-volume">100%</output></label><input id="effects-volume" type="range" min="0" max="100" value="100"><p class="settings-controls">Z: jump / double jump · X: leaf dash · P: pause</p><button id="install" type="button" hidden>Install game</button><p id="notice" class="settings-notice" role="status"></p><button id="settings-done" type="button">Done</button></div></section>

</section>
</main><audio id="default-music" src="always-free.mp3" preload="metadata" loop hidden></audio><script type="module" src="main.js"></script><script defer src="pwa.js?v=uniboar-pwa-1"></script></body></html>
