name: Deploy Dziki Discord Worker

on:
  push:
    branches: [main]
    paths:
      - automation/discord-worker/**
      - automation/games.mjs
      - automation/history.mjs
      - .github/workflows/discord-worker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check Discord routing before deployment
        run: node --test automation/*.test.mjs
      - name: Report notification configuration
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: node -e "console.log('Existing Discord bot token configured:', Boolean(process.env.DISCORD_BOT_TOKEN))"
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Deploy again after the Cloudflare token permissions were updated.
        run: npx --yes wrangler@latest deploy --config automation/discord-worker/wrangler.toml
      - name: Register public game history command
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID }}
        run: node automation/discord-worker/register-commands.mjs
