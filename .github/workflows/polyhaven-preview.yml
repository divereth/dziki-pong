name: Preview realistic Dziki Sprzedawca

on:
  push:
    branches: [automation/polyhaven-goods-2026-11-12]
    paths:
      - games/dziki-sprzedawca/**
      - automation/game-tools.mjs
      - .github/workflows/polyhaven-preview.yml

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check complete catalog, game logic and realistic stalls
        run: node automation/game-tools.mjs check dziki-sprzedawca
      - name: Build self-contained game
        run: node automation/game-tools.mjs build dziki-sprzedawca
      - name: Publish game preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest pages deploy .artifacts/dziki-sprzedawca --project-name dzikisprzedawca --branch polyhaven-models --commit-dirty=true
