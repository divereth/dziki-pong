name: Import Poly Haven market models

on:
  push:
    branches: [automation/polyhaven-goods-2026-11-12]
    paths:
      - games/dziki-sprzedawca/tools/**
      - .github/workflows/polyhaven-import.yml

permissions:
  contents: write

concurrency:
  group: polyhaven-market-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned asset conversion tools
        run: npm install --prefix games/dziki-sprzedawca/tools --ignore-scripts --no-audit --no-fund
      - name: Download, verify and optimize Poly Haven models
        run: node games/dziki-sprzedawca/tools/import-polyhaven.mjs
      - name: Commit self-contained game models
        if: always()
        run: |
          git config user.name "Dziki asset import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if test -f games/dziki-sprzedawca/assets/polyhaven/manifest.json; then
            git add -- games/dziki-sprzedawca/catalog.js games/dziki-sprzedawca/assets/polyhaven
            if ! git diff --cached --quiet; then
              git commit -m "Import optimized CC0 Poly Haven market models"
              git push origin HEAD:automation/polyhaven-goods-2026-11-12
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polyhaven-import-diagnostics
          path: .artifacts/polyhaven/import-failures.json
          if-no-files-found: ignore
