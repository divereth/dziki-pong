name: Check Discord notification configuration
on:
  push:
    branches: [automation/check-discord-config-2026-10-17]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check existing credential locations without printing token values
        env:
          BOT_SECRET_PRESENT: ${{ secrets.DISCORD_BOT_TOKEN != '' }}
          BOT_ALIAS_PRESENT: ${{ secrets.DISCORD_TOKEN != '' }}
          BOT_VARIABLE_PRESENT: ${{ vars.DISCORD_BOT_TOKEN != '' }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          const response = await fetch('https://api.cloudflare.com/client/v4/accounts/' + process.env.CF_ACCOUNT + '/workers/scripts/dziki-pong-discord/secrets', { headers: { authorization: 'Bearer ' + process.env.CF_TOKEN } });
          let runtimeBotSecret = null;
          if (response.ok) { const body = await response.json(); runtimeBotSecret = (body.result || []).some(secret => secret.name === 'DISCORD_BOT_TOKEN'); }
          const settings = await fetch('https://api.cloudflare.com/client/v4/accounts/' + process.env.CF_ACCOUNT + '/workers/scripts/dziki-pong-discord/settings', { headers: { authorization: 'Bearer ' + process.env.CF_TOKEN } });
          let runtimeBotBinding = null;
          let runtimeDiscordAlias = null;
          if (settings.ok) { const body = await settings.json(); const bindings = body.result?.bindings || []; runtimeBotBinding = bindings.some(binding => binding.name?.toUpperCase() === 'DISCORD_BOT_TOKEN'); runtimeDiscordAlias = bindings.some(binding => binding.name?.toUpperCase() === 'DISCORD_TOKEN'); }
          console.log(JSON.stringify({ githubDiscordTokenAlias: process.env.BOT_ALIAS_PRESENT === 'true', cloudflareBotBinding: runtimeBotBinding, cloudflareDiscordTokenAlias: runtimeDiscordAlias, settingsStatus: settings.status, githubProductionBotSecret: process.env.BOT_SECRET_PRESENT === 'true', githubBotVariable: process.env.BOT_VARIABLE_PRESENT === 'true', cloudflareBotSecret: runtimeBotSecret, metadataStatus: response.status }));
          JS
