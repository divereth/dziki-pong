name: Dziki Pong Discord request

on:
  repository_dispatch:
    types: [dziki_request, dziki_promote]

permissions:
  contents: write
  pull-requests: write

jobs:
  request:
    if: github.event.action == 'dziki_request'
    runs-on: ubuntu-latest
    env:
      REQUEST_ID: ${{ github.event.client_payload.request_id }}
      REQUEST_TEXT: ${{ github.event.client_payload.request_text }}
      DISCORD_USER: ${{ github.event.client_payload.discord_user_name }}
      CF_PROJECT: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate request payload
        shell: bash
        run: |
          test -n "$REQUEST_ID"
          test -n "$REQUEST_TEXT"
          case "$REQUEST_ID" in
            *[!A-Za-z0-9_-]*) echo "Invalid request id"; exit 1 ;;
          esac

      - name: Create request branch
        shell: bash
        run: |
          git config user.name "dziki-pong automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "discord/$REQUEST_ID"

      - name: Report started
        env:
          MAIN_WEBHOOK: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
          DEV_WEBHOOK: ${{ secrets.DISCORD_DEV_WEBHOOK_URL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [ -n "$MAIN_WEBHOOK" ]; then
            payload="$(jq -n '{content: "🟡 Przyjęte! Dziki pracuje nad Twoją zmianą."}')"
            curl --fail-with-body -sS -H 'content-type: application/json' -d "$payload" "$MAIN_WEBHOOK" || true
          fi
          if [ -n "$DEV_WEBHOOK" ]; then
            payload="$(jq -n --arg id "$REQUEST_ID" --arg user "$DISCORD_USER" --arg run "$RUN_URL" '{content: ("🟡 Zlecenie " + $id + " rozpoczęte przez " + $user + ". Codex analizuje repozytorium. GitHub Actions: " + $run)}')"
            curl --fail-with-body -sS -H 'content-type: application/json' -d "$payload" "$DEV_WEBHOOK" || true
          fi
      - name: Build Codex prompt
        shell: bash
        run: |
          {
            cat .github/codex/discord-request.md
            printf '%s\n' "$REQUEST_TEXT"
            printf '\nRequest metadata: Discord user %s, request id %s.\n' "$DISCORD_USER" "$REQUEST_ID"
          } > .github/codex/runtime-request.md

      - name: Run Codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/runtime-request.md
          sandbox: workspace-write
          model: gpt-5.6-luna
          effort: high
          output-file: codex-output.md

      - name: Report Codex progress
        if: success()
        env:
          DEV_WEBHOOK: ${{ secrets.DISCORD_DEV_WEBHOOK_URL }}
        shell: bash
        run: |
          if [ -n "$DEV_WEBHOOK" ]; then
            payload="$(jq -n --arg id "$REQUEST_ID" '{content: ("🔵 Zlecenie " + $id + ": Codex zakończył pracę. Trwa sprawdzanie zmian i przygotowanie PR-a.")}')"
            curl --fail-with-body -sS -H 'content-type: application/json' -d "$payload" "$DEV_WEBHOOK" || true
          fi
      - name: Check and commit changes
        shell: bash
        run: |
          node --check game.js
          rm -f .github/codex/runtime-request.md codex-output.md
          changed="$(git diff --name-only HEAD)"
          test -n "$changed"
          while IFS= read -r path; do
            case "$path" in
              game.js|index.html|style.css) ;;
              *) echo "Blocked unexpected file change: $path"; exit 1 ;;
            esac
          done <<< "$changed"
          git add -A
          if git diff --cached --quiet; then
            echo "Codex made no changes."
            exit 1
          fi
          git commit -m "Discord request $REQUEST_ID"
          git push --set-upstream origin "discord/$REQUEST_ID"

      - name: Open pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          url="$(gh pr create --base main --head "discord/$REQUEST_ID" --title "Discord request $REQUEST_ID" --body "Requested by $DISCORD_USER. Review the Codex-generated change before publishing.")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Report PR ready
        if: success()
        env:
          DEV_WEBHOOK: ${{ secrets.DISCORD_DEV_WEBHOOK_URL }}
          PR_URL: ${{ steps.pr.outputs.url }}
        shell: bash
        run: |
          if [ -n "$DEV_WEBHOOK" ]; then
            payload="$(jq -n --arg id "$REQUEST_ID" --arg pr "$PR_URL" '{content: ("🟣 Zlecenie " + $id + ": PR gotowy do przeglądu: " + $pr + ". Za chwilę uruchamiam podgląd.")}')"
            curl --fail-with-body -sS -H 'content-type: application/json' -d "$payload" "$DEV_WEBHOOK" || true
          fi
      - name: Deploy request preview
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          npx --yes wrangler@latest pages deploy . --project-name "$CF_PROJECT" --branch "discord-$REQUEST_ID" 2>&1 | tee cloudflare.log
          preview_url="$(grep -Eo 'https://[A-Za-z0-9.-]+pages.dev' cloudflare.log | tail -1 || true)"
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Report result
        if: always()
        env:
          MAIN_WEBHOOK: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
          DEV_WEBHOOK: ${{ secrets.DISCORD_DEV_WEBHOOK_URL }}
          PR_URL: ${{ steps.pr.outputs.url }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = "success" ] && [ -n "$PREVIEW_URL" ]; then
            main_message="✅ Gotowe! Podgląd zmiany: $PREVIEW_URL"
            dev_message="✅ Zlecenie $REQUEST_ID gotowe. Podgląd: $PREVIEW_URL | PR: $PR_URL | GitHub Actions: $RUN_URL"
          elif [ "$JOB_STATUS" = "success" ]; then
            main_message="✅ Zmiana jest gotowa. Opiekun sprawdzi podgląd."
            dev_message="✅ Zlecenie $REQUEST_ID zakończone, ale nie udało się odczytać adresu podglądu. PR: $PR_URL | GitHub Actions: $RUN_URL"
          else
            main_message="⚠️ Coś poszło nie tak. Opiekun zajrzy do kanału deweloperskiego."
            dev_message="❌ Zlecenie $REQUEST_ID nie powiodło się. Sprawdź GitHub Actions: $RUN_URL | PR: $PR_URL"
          fi
          if [ -n "$MAIN_WEBHOOK" ]; then
            payload="$(jq -n --arg content "$main_message" '{content: $content}')"
            curl --fail-with-body -sS -H 'content-type: application/json' -d "$payload" "$MAIN_WEBHOOK" || true
          fi
          if [ -n "$DEV_WEBHOOK" ]; then
            payload="$(jq -n --arg content "$dev_message" '{content: $content}')"
            curl --fail-with-body -sS -H 'content-type: application/json' -d "$payload" "$DEV_WEBHOOK" || true
          fi

  promote:
    if: github.event.action == 'dziki_promote' && github.event.client_payload.is_admin == true
    runs-on: ubuntu-latest
    env:
      REQUEST_ID: ${{ github.event.client_payload.request_id }}
    steps:
      - name: Find and merge reviewed PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test -n "$REQUEST_ID"
          case "$REQUEST_ID" in
            *[!A-Za-z0-9_-]*) echo "Invalid request id"; exit 1 ;;
          esac
          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "discord/$REQUEST_ID" --json number --jq '.[0].number')"
          test -n "$number"
          gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --squash --delete-branch=false --subject "Publish Discord request $REQUEST_ID" --body "Published by the configured Discord admin."

      - name: Report publish result
        if: always()
        env:
          MAIN_WEBHOOK: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
          DEV_WEBHOOK: ${{ secrets.DISCORD_DEV_WEBHOOK_URL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            main_message="🚀 Zmiana trafiła do gry!"
            dev_message="🚀 Zlecenie $REQUEST_ID opublikowane. Produkcja: https://dziki-pong.pages.dev/ | GitHub Actions: $RUN_URL"
          else
            main_message="⚠️ Publikowanie nie powiodło się. Opiekun sprawdzi sprawę."
            dev_message="❌ Publikowanie zlecenia $REQUEST_ID nie powiodło się. Sprawdź GitHub Actions: $RUN_URL"
          fi
          if [ -n "$MAIN_WEBHOOK" ]; then
            payload="$(jq -n --arg content "$main_message" '{content: $content}')"
            curl --fail-with-body -sS -H 'content-type: application/json' -d "$payload" "$MAIN_WEBHOOK" || true
          fi
          if [ -n "$DEV_WEBHOOK" ]; then
            payload="$(jq -n --arg content "$dev_message" '{content: $content}')"
            curl --fail-with-body -sS -H 'content-type: application/json' -d "$payload" "$DEV_WEBHOOK" || true
          fi