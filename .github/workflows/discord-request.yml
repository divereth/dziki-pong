name: Dziki Discord request

on:
  repository_dispatch:
    types: [dziki_request, dziki_promote]

permissions:
  contents: write
  pull-requests: write

env:
  GAME_ID: ${{ github.event.client_payload.game_id || 'dziki-pong' }}
  REQUEST_ID: ${{ github.event.client_payload.request_id }}
  DISCORD_CHANNEL_ID: ${{ github.event.client_payload.discord_channel_id }}
  DISCORD_DEV_CHANNEL_ID: '1398036719101542601'

jobs:
  request:
    if: github.event.action == 'dziki_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      preview_url: ${{ steps.preview.outputs.url }}
      pr_url: ${{ steps.pr.outputs.url }}
      changed: ${{ steps.changes.outputs.changed }}
      summary_b64: ${{ steps.changes.outputs.summary_b64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare trusted tools and select game
        env:
          REQUEST_TEXT: ${{ github.event.client_payload.request_text }}
        run: |
          mkdir -p "$RUNNER_TEMP/dziki-tools"
          cp automation/*.mjs "$RUNNER_TEMP/dziki-tools/"
          echo "DZIKI_REPOSITORY_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          node automation/game-tools.mjs configure
          node automation/request.mjs prompt
          git config user.name "Dziki automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "discord/$REQUEST_ID"
      - name: Report started
        env:
          DISCORD_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
          DISCORD_SPRZEDAWCA_WEBHOOK_URL: ${{ secrets.DISCORD_SPRZEDAWCA_WEBHOOK_URL }}
          DISCORD_BIEG_WEBHOOK_URL: ${{ secrets.DISCORD_BIEG_WEBHOOK_URL }}
          DISCORD_KARABIN_WEBHOOK_URL: ${{ secrets.DISCORD_KARABIN_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: node "$RUNNER_TEMP/dziki-tools/notify.mjs" started
      - name: Run Codex
        timeout-minutes: 30
        uses: openai/codex-action@v1.11
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: "0.158.0"
          prompt-file: ${{ runner.temp }}/dziki-request.md
          sandbox: workspace-write
          model: gpt-6-luna
          effort: high
          output-file: ${{ runner.temp }}/dziki-output.md
      - name: Inspect generated changes and capture explanation
        id: changes
        run: node "$RUNNER_TEMP/dziki-tools/request.mjs" inspect
      - name: Report code ready
        if: steps.changes.outputs.changed == 'true'
        env:
          DISCORD_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
          DISCORD_SPRZEDAWCA_WEBHOOK_URL: ${{ secrets.DISCORD_SPRZEDAWCA_WEBHOOK_URL }}
          DISCORD_BIEG_WEBHOOK_URL: ${{ secrets.DISCORD_BIEG_WEBHOOK_URL }}
          DISCORD_KARABIN_WEBHOOK_URL: ${{ secrets.DISCORD_KARABIN_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: node "$RUNNER_TEMP/dziki-tools/notify.mjs" generated
      - name: Validate game boundary and run game checks
        if: steps.changes.outputs.changed == 'true'
        run: |
          node "$RUNNER_TEMP/dziki-tools/game-tools.mjs" validate
          node "$RUNNER_TEMP/dziki-tools/game-tools.mjs" check
          node "$RUNNER_TEMP/dziki-tools/game-tools.mjs" build
      - name: Commit request and open PR
        if: steps.changes.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_TEXT: ${{ github.event.client_payload.request_text }}
          DISCORD_USER_ID: ${{ github.event.client_payload.discord_user_id }}
        run: |
          gh auth setup-git
          git add -- "$GAME_SITE"
          git commit -m "$GAME_NAME: Discord request $REQUEST_ID"
          git push --set-upstream origin "discord/$REQUEST_ID"
          node "$RUNNER_TEMP/dziki-tools/request.mjs" pr
      - name: Report preview upload
        if: steps.changes.outputs.changed == 'true'
        env:
          DISCORD_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
          DISCORD_SPRZEDAWCA_WEBHOOK_URL: ${{ secrets.DISCORD_SPRZEDAWCA_WEBHOOK_URL }}
          DISCORD_BIEG_WEBHOOK_URL: ${{ secrets.DISCORD_BIEG_WEBHOOK_URL }}
          DISCORD_KARABIN_WEBHOOK_URL: ${{ secrets.DISCORD_KARABIN_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: node "$RUNNER_TEMP/dziki-tools/notify.mjs" preview
      - name: Deploy request preview
        if: steps.changes.outputs.changed == 'true'
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest pages deploy ".artifacts/$GAME_ID" --project-name "$CF_PROJECT" --branch "discord-$REQUEST_ID" --commit-dirty=true
          echo "url=https://discord-$REQUEST_ID.$CF_PROJECT.pages.dev/" >> "$GITHUB_OUTPUT"

  promote:
    if: github.event.action == 'dziki_promote' && github.event.client_payload.is_admin == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Select game
        run: node automation/game-tools.mjs configure
      - name: Verify game and channel, merge reviewed PR, start production deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: node automation/request.mjs promote

  report:
    needs: [request, promote]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Report completed, failed or timed out task
        env:
          DISCORD_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
          DISCORD_SPRZEDAWCA_WEBHOOK_URL: ${{ secrets.DISCORD_SPRZEDAWCA_WEBHOOK_URL }}
          DISCORD_BIEG_WEBHOOK_URL: ${{ secrets.DISCORD_BIEG_WEBHOOK_URL }}
          DISCORD_KARABIN_WEBHOOK_URL: ${{ secrets.DISCORD_KARABIN_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          PR_URL: ${{ needs.request.outputs.pr_url }}
          PREVIEW_URL: ${{ needs.request.outputs.preview_url }}
          REQUEST_CHANGED: ${{ needs.request.outputs.changed }}
          REQUEST_SUMMARY_B64: ${{ needs.request.outputs.summary_b64 }}
          JOB_STATUS: ${{ github.event.action == 'dziki_request' && needs.request.result || needs.promote.result }}
          REPORT_STAGE: ${{ github.event.action == 'dziki_request' && 'result' || 'promotion' }}
        run: node automation/notify.mjs "$REPORT_STAGE"
