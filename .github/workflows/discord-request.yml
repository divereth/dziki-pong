name: Dziki Pong Discord request

on:
  repository_dispatch:
    types: [dziki_request, dziki_promote]

permissions:
  contents: write
  pull-requests: write

jobs:
  request:
    if: github.event.action == 'dziki_request'
    runs-on: ubuntu-latest
    env:
      REQUEST_ID: ${{ github.event.client_payload.request_id }}
      REQUEST_TEXT: ${{ github.event.client_payload.request_text }}
      DISCORD_USER: ${{ github.event.client_payload.discord_user_name }}
      DISCORD_USER_ID: ${{ github.event.client_payload.discord_user_id }}
      CF_PROJECT: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate request payload
        shell: bash
        run: |
          test -n "$REQUEST_ID"
          test -n "$REQUEST_TEXT"
          case "$REQUEST_ID" in
            *[!A-Za-z0-9_-]*) echo "Invalid request id"; exit 1 ;;
          esac

      - name: Create request branch
        shell: bash
        run: |
          git config user.name "dziki-pong automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "discord/$REQUEST_ID"

      - name: Report started
        env:
          MAIN_WEBHOOK: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
          DEV_WEBHOOK: ${{ secrets.DISCORD_DEV_WEBHOOK_URL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          mkdir -p work
          base64 --decode assets/dziki-working-loop.gif.b64 > work/dziki-working-loop.gif
          if [ -n "$MAIN_WEBHOOK" ]; then
            if [[ "$DISCORD_USER_ID" =~ ^[0-9]+$ ]]; then
              payload="$(jq -n --arg user "$DISCORD_USER_ID" '{content: ("🐗 Dziki pracuje nad zmianą dla <@" + $user + ">! Trzymaj kciuki."),allowed_mentions:{parse:[],users:[$user]}}')"
            else
              payload="$(jq -n '{content:"🐗 Dziki zabrał się za pracę nad zmianą! Trzymaj kciuki.",allowed_mentions:{parse:[],users:[]}}')"
            fi
            curl --fail-with-body -sS -F "payload_json=$payload" -F "files[0]=@work/dziki-working-loop.gif;type=image/gif;filename=dziki-working-loop.gif" "$MAIN_WEBHOOK" || true
          fi
          if [ -n "$DEV_WEBHOOK" ]; then
            payload="$(jq -n --arg id "$REQUEST_ID" --arg user "$DISCORD_USER" --arg run "$RUN_URL" '{content: ("🟡 Zlecenie " + $id + " rozpoczęte przez " + $user + ". Codex analizuje repozytorium. GitHub Actions: " + $run)}')"
            curl --fail-with-body -sS -H 'content-type: application/json' -d "$payload" "$DEV_WEBHOOK" || true
          fi
      - name: Build Codex prompt
        shell: bash
        run: |
          {
            cat .github/codex/discord-request.md
            printf '%s\n' "$REQUEST_TEXT"
            printf '\nRequest metadata: Discord user %s, request id %s.\n' "$DISCORD_USER" "$REQUEST_ID"
          } > .github/codex/runtime-request.md

      - name: Run Codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/runtime-request.md
          sandbox: workspace-write
          model: gpt-6-luna
          effort: high
          output-file: codex-output.md

      - name: Report Codex progress
        if: success()
        env:
          DEV_WEBHOOK: ${{ secrets.DISCORD_DEV_WEBHOOK_URL }}
        shell: bash
        run: |
          if [ -n "$DEV_WEBHOOK" ]; then
            payload="$(jq -n --arg id "$REQUEST_ID" '{content: ("🔵 Zlecenie " + $id + ": Codex zakończył pracę. Trwa sprawdzanie zmian i przygotowanie PR-a.")}')"
            curl --fail-with-body -sS -H 'content-type: application/json' -d "$payload" "$DEV_WEBHOOK" || true
          fi
      - name: Check and commit changes
        shell: bash
        run: |
          node --check game.js
          rm -f .github/codex/runtime-request.md codex-output.md
          changed="$(git diff --name-only HEAD)"
          test -n "$changed"
          while IFS= read -r path; do
            case "$path" in
              game.js|index.html|style.css) ;;
              *) echo "Blocked unexpected file change: $path"; exit 1 ;;
            esac
          done <<< "$changed"
          git add -A
          if git diff --cached --quiet; then
            echo "Codex made no changes."
            exit 1
          fi
          git commit -m "Discord request $REQUEST_ID"
          git push --set-upstream origin "discord/$REQUEST_ID"

      - name: Open pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          body="$(printf 'Requested by %s.\n\nDiscord requester ID: %s\n\nReview the Codex-generated change before publishing.' "$DISCORD_USER" "$DISCORD_USER_ID")"
          url="$(gh pr create --base main --head "discord/$REQUEST_ID" --title "Discord request $REQUEST_ID" --body "$body")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Report PR ready
        if: success()
        env:
          DEV_WEBHOOK: ${{ secrets.DISCORD_DEV_WEBHOOK_URL }}
          PR_URL: ${{ steps.pr.outputs.url }}
        shell: bash
        run: |
          if [ -n "$DEV_WEBHOOK" ]; then
            payload="$(jq -n --arg id "$REQUEST_ID" --arg pr "$PR_URL" '{content: ("🟣 Zlecenie " + $id + ": PR gotowy do przeglądu: " + $pr + ". Za chwilę uruchamiam podgląd.")}')"
            curl --fail-with-body -sS -H 'content-type: application/json' -d "$payload" "$DEV_WEBHOOK" || true
          fi
      - name: Deploy request preview
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npx --yes wrangler@latest pages deploy . --project-name "$CF_PROJECT" --branch "discord-$REQUEST_ID" > cloudflare.log 2>&1; then
              cat cloudflare.log
              break
            else
              status=$?
              cat cloudflare.log
              if [ "$attempt" -eq 3 ]; then
                exit "$status"
              fi
              echo "Cloudflare preview upload failed (attempt $attempt/3); retrying in 10 seconds."
              sleep 10
            fi
          done
          preview_url="$(grep -Eo 'https://[A-Za-z0-9.-]+pages.dev' cloudflare.log | tail -1 || true)"
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Report result
        if: always()
        env:
          MAIN_WEBHOOK: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
          DEV_WEBHOOK: ${{ secrets.DISCORD_DEV_WEBHOOK_URL }}
          PR_URL: ${{ steps.pr.outputs.url }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = "success" ] && [ -n "$PREVIEW_URL" ]; then
            main_message="✅ Gotowe! Podgląd zmiany: $PREVIEW_URL"
            dev_message="✅ Zlecenie $REQUEST_ID gotowe. Podgląd: $PREVIEW_URL | PR: $PR_URL | GitHub Actions: $RUN_URL"
          elif [ "$JOB_STATUS" = "success" ]; then
            main_message="✅ Zmiana jest gotowa. Opiekun sprawdzi podgląd."
            dev_message="✅ Zlecenie $REQUEST_ID zakończone, ale nie udało się odczytać adresu podglądu. PR: $PR_URL | GitHub Actions: $RUN_URL"
          else
            main_message="⚠️ Coś poszło nie tak. Opiekun zajrzy do kanału deweloperskiego."
            dev_message="❌ Zlecenie $REQUEST_ID nie powiodło się. Sprawdź GitHub Actions: $RUN_URL | PR: $PR_URL"
          fi
          if [ -n "$MAIN_WEBHOOK" ]; then
            payload="$(jq -n --arg content "$main_message" '{content: $content}')"
            curl --fail-with-body -sS -H 'content-type: application/json' -d "$payload" "$MAIN_WEBHOOK" || true
          fi
          if [ -n "$DEV_WEBHOOK" ]; then
            payload="$(jq -n --arg content "$dev_message" '{content: $content}')"
            curl --fail-with-body -sS -H 'content-type: application/json' -d "$payload" "$DEV_WEBHOOK" || true
          fi

  promote:
    if: github.event.action == 'dziki_promote' && github.event.client_payload.is_admin == true
    runs-on: ubuntu-latest
    env:
      REQUEST_ID: ${{ github.event.client_payload.request_id }}
    steps:
      - name: Find and merge reviewed PR
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test -n "$REQUEST_ID"
          case "$REQUEST_ID" in
            *[!A-Za-z0-9_-]*) echo "Invalid request id"; exit 1 ;;
          esac
          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "discord/$REQUEST_ID" --json number --jq '.[0].number')"
          test -n "$number"
          gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --squash --delete-branch=false --subject "Publish Discord request $REQUEST_ID" --body "Published by the configured Discord admin."
          body="$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          author_id="$(printf '%s\n' "$body" | sed -nE 's/^Discord requester ID: ([0-9]+)$/\1/p' | head -n 1)"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "author_id=$author_id" >> "$GITHUB_OUTPUT"

      - name: Start production deployment
        id: dispatch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.merge.outputs.number }}
          AUTHOR_ID: ${{ steps.merge.outputs.author_id }}
        shell: bash
        run: |
          jq -n --arg id "$REQUEST_ID" --arg author "$AUTHOR_ID" --arg pr "$PR_NUMBER" \
            '{event_type:"deploy_production",client_payload:{request_id:$id,discord_user_id:$author,pr_number:$pr}}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" --input -

      - name: Report merge and deployment start
        if: always()
        env:
          DEV_WEBHOOK: ${{ secrets.DISCORD_DEV_WEBHOOK_URL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            message="🟣 Zlecenie $REQUEST_ID: PR #${{ steps.merge.outputs.number }} scalony. Wdrożenie produkcji uruchomione; czekam na potwierdzenie Cloudflare. GitHub Actions: $RUN_URL"
          else
            message="❌ Nie udało się scalić lub uruchomić wdrożenia zlecenia $REQUEST_ID. Sprawdź GitHub Actions: $RUN_URL"
          fi
          if [ -n "$DEV_WEBHOOK" ]; then
            payload="$(jq -n --arg content "$message" '{content: $content}')"
            curl --fail-with-body -sS -H 'content-type: application/json' -d "$payload" "$DEV_WEBHOOK" || true
          fi