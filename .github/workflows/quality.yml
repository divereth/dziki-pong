name: Dziki game and integration checks

on:
  push:
    branches: [main, 'discord/**', 'automation/**']
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check Discord routing, permissions, and build isolation
        run: node --test automation/*.test.mjs
      - name: Check all four games and build deployable packages
        run: |
          for game in dziki-pong dziki-sprzedawca dziki-bieg dziki-karabin; do
            node automation/game-tools.mjs check "$game"
            node automation/game-tools.mjs build "$game"
          done
