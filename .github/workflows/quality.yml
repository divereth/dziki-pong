name: Dziki Pong quality checks

on:
  push:
    branches: [main, 'discord/**', 'automation/**']
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript
        run: node --check game.js
