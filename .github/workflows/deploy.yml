name: Deploy Dziki games production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      game_id:
        description: Gra do opublikowania
        type: choice
        default: dziki-pong
        options: [dziki-pong, dziki-sprzedawca, dziki-bieg, dziki-karabin, all]
  repository_dispatch:
    types: [deploy_production]

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.games.outputs.matrix }}
      count: ${{ steps.games.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: games
        run: node automation/select-games.mjs

  deploy:
    needs: select
    if: needs.select.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-${{ matrix.game_id }}
      cancel-in-progress: false
    env:
      GAME_ID: ${{ matrix.game_id }}
      REQUEST_ID: ${{ github.event.client_payload.request_id }}
      DISCORD_CHANNEL_ID: ${{ github.event.client_payload.discord_channel_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Select game, run checks, build public files
        run: |
          node automation/game-tools.mjs configure
          node automation/game-tools.mjs check
          node automation/game-tools.mjs build
      - name: Deploy to the game's Cloudflare Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest pages deploy ".artifacts/$GAME_ID" --project-name "$CF_PROJECT" --branch main --commit-dirty=true
      - name: Report production deployment result
        if: always() && github.event_name == 'repository_dispatch'
        env:
          DISCORD_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
          DISCORD_DEV_WEBHOOK_URL: ${{ secrets.DISCORD_DEV_WEBHOOK_URL }}
          DISCORD_SPRZEDAWCA_WEBHOOK_URL: ${{ secrets.DISCORD_SPRZEDAWCA_WEBHOOK_URL }}
          DISCORD_BIEG_WEBHOOK_URL: ${{ secrets.DISCORD_BIEG_WEBHOOK_URL }}
          DISCORD_KARABIN_WEBHOOK_URL: ${{ secrets.DISCORD_KARABIN_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: node automation/notify.mjs production
